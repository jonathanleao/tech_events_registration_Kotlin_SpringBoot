spring.application.name=EventosTechApiKotlin

spring.datasource.url=jdbc:mysql://localhost:3306/tech_events_kotlin?createDatabaseIfNotExist=true&serverTimezone=America/Manaus
spring.datasource.username=teu username
spring.datasource.password=tua senha do banco de dados
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.error.include-message=always

//Minoru, pra ficar um pouco mais organizado, apaga a palavra "Example" do nome do arquivo, e deixa só "application.properties", que é o padrão do Spring Boot. E também, não esquece de colocar o teu username e a tua senha do banco de dados no lugar de "teu username" e "tua senha do banco de dados".